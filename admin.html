<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Moksa Digital Market</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --sage-green: #8A9A86;
      --lilac: #9370DB;
      --navy-dark: #0B132B;
      --navy-card: #1C2541;
      --cream-light: #F4F1EA;
    }

    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--navy-dark) 0%, #1B263B 50%, #4A3B69 100%);
      color: var(--cream-light);
      min-height: 100vh;
      padding: 20px;
    }

    #loginOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--navy-dark);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      background: rgba(27, 38, 59, 0.85);
      border: 1px solid rgba(200, 162, 200, 0.2);
      backdrop-filter: blur(16px);
      padding: 30px;
      border-radius: 20px;
      width: 100%; max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .login-box h2 {
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--sage-green), var(--lilac));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      display: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: rgba(27, 38, 59, 0.75);
      border: 1px solid rgba(200, 162, 200, 0.2);
      border-radius: 16px;
      margin-bottom: 25px;
      backdrop-filter: blur(10px);
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--sage-green), var(--lilac));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 12px; border: none;
      cursor: pointer; font-weight: 600; font-size: 0.85rem;
      transition: all 0.3s ease;
      display: inline-flex; align-items: center; gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--sage-green), var(--lilac));
      color: #fff;
    }

    .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }

    .btn-danger {
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid rgba(220, 53, 69, 0.4);
      color: #ff6b6b;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 25px;
    }

    @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }

    .card {
      background: rgba(27, 38, 59, 0.75);
      border: 1px solid rgba(200, 162, 200, 0.2);
      border-radius: 16px;
      padding: 25px;
      backdrop-filter: blur(10px);
    }

    .card h3 {
      margin-bottom: 20px;
      color: var(--sage-green);
      font-size: 1.1rem;
      display: flex; align-items: center; gap: 10px;
    }

    .form-group { margin-bottom: 15px; }

    .form-group label {
      display: block; margin-bottom: 6px;
      font-size: 0.8rem; color: #ccc;
    }

    .form-control {
      width: 100%; padding: 12px;
      background: rgba(11, 19, 43, 0.8);
      border: 1px solid rgba(200, 162, 200, 0.2);
      border-radius: 10px;
      color: var(--cream-light);
      outline: none; font-size: 0.85rem;
      transition: 0.3s;
    }

    .form-control:focus {
      border-color: var(--lilac);
      box-shadow: 0 0 8px rgba(147, 112, 219, 0.4);
    }

    textarea.form-control { resize: vertical; min-height: 80px; }

    .product-list {
      display: flex; flex-direction: column; gap: 12px;
      max-height: 550px; overflow-y: auto; padding-right: 5px;
    }

    .product-item {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid rgba(200, 162, 200, 0.15);
      padding: 12px 15px; border-radius: 12px; gap: 15px;
    }

    .product-item img {
      width: 45px; height: 45px; object-fit: cover; border-radius: 8px;
    }

    .product-info { flex: 1; }
    .product-info h4 { font-size: 0.9rem; margin-bottom: 4px; color: #fff; }
    .product-info span {
      font-size: 0.7rem; background: rgba(147, 112, 219, 0.2);
      color: var(--lilac); padding: 2px 8px; border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Login Modal -->
  <div id="loginOverlay">
    <div class="login-box">
      <h2><i class="fa-solid fa-lock"></i> Admin Login</h2>
      <p style="font-size:0.8rem; color:#aaa; margin-bottom:20px;">Masukkan password admin Moksa Digital Market</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <input type="password" id="adminPassword" class="form-control" placeholder="Masukan Password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Masuk Dashboard</button>
      </form>
    </div>
  </div>

  <!-- Main Admin Container -->
  <div class="admin-container" id="adminDashboard">
    <header>
      <div class="brand-title">
        <i class="fa-solid fa-store"></i> Moksa Admin Panel
      </div>
      <div style="display:flex; gap:10px;">
        <a href="index.html" target="_blank" class="btn" style="background:rgba(255,255,255,0.1); color:#fff; text-decoration:none;">
          <i class="fa-solid fa-eye"></i> Lihat Toko Utama
        </a>
        <button onclick="logout()" class="btn btn-danger">
          <i class="fa-solid fa-right-from-bracket"></i> Keluar
        </button>
      </div>
    </header>

    <div class="grid-layout">
      <!-- Form Input Produk -->
      <div class="card">
        <h3><i class="fa-solid fa-plus-circle"></i> Tambah Produk & Link Social Buzz</h3>
        <form id="productForm" onsubmit="saveProduct(event)">
          <div class="form-group">
            <label>Nama Produk Digital</label>
            <input type="text" id="productTitle" class="form-control" placeholder="Contoh: Mod Whatsapp Premium / Ebook PDF" required>
          </div>

          <div class="form-group">
            <label>Kategori Produk</label>
            <select id="productCategory" class="form-control" required>
              <option value="APK Premium">APK Premium (Aplikasi Android)</option>
              <option value="APK Gratis">APK Gratis (Aplikasi Free)</option>
              <option value="PDF">PDF (E-Book / Dokumen)</option>
              <option value="HTML">HTML (Source Code Web)</option>
              <option value="DOCX">DOCX (Template Word)</option>
            </select>
          </div>

          <div class="form-group" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div>
              <label>Harga (Rp) [0 jika Gratis]</label>
              <input type="number" id="productPrice" class="form-control" placeholder="25000" required>
            </div>
            <div>
              <label>Ukuran File</label>
              <input type="text" id="productSize" class="form-control" placeholder="Contoh: 15 MB" required>
            </div>
          </div>

          <div class="form-group">
            <label>URL / Link Halaman Produk Social Buzz</label>
            <input type="url" id="productSociabuzzUrl" class="form-control" placeholder="https://sociabuzz.com/username/p/nama-produk" required>
          </div>

          <div class="form-group">
            <label>URL Gambar / Thumbnail (Contoh dari ImgBB)</label>
            <input type="url" id="productImage" class="form-control" placeholder="https://i.ibb.co/..." required>
          </div>

          <div class="form-group">
            <label>Deskripsi Singkat Produk</label>
            <textarea id="productDesc" class="form-control" placeholder="Jelaskan keunggulan produk digital ini..." required></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:5px;">
            <i class="fa-solid fa-cloud-arrow-up"></i> Upload & Hubungkan ke Toko Cloud
          </button>
        </form>
      </div>

      <!-- List Daftar Produk -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h3 style="margin:0;"><i class="fa-solid fa-boxes-stacked"></i> Produk Aktif Cloud (<span id="totalProductsCount">0</span>)</h3>
        </div>

        <div class="product-list" id="adminProductList">
          <!-- Item produk otomatis disuntikkan lewat JS -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin123";

    // ==========================================
    // MASUKKAN KREDENSIAL SUPABASE ANDA DI SINI
    // ==========================================
    const SUPABASE_URL = 'https://gtvctshbamzndjppisdz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0dmN0c2hiYW16bmRqcHBpc2R6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNzc1NDksImV4cCI6MjEwODY1MzU0OX0.8GZwmpxGgGKJxGBc9W-kBmxeba7oNaNnSjjwVEYQi70';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function handleLogin(e) {
      e.preventDefault();
      if (document.getElementById('adminPassword').value === ADMIN_PASSWORD) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        loadAdminProducts();
      } else {
        alert("Password Yang Anda Masukan Salah!");
      }
    }

    function logout() {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('adminDashboard').style.display = 'none';
      document.getElementById('adminPassword').value = '';
    }

    async function loadAdminProducts() {
      const { data: products, error } = await _supabase.from('products').select('*').order('id', { ascending: false });
      const container = document.getElementById('adminProductList');
      document.getElementById('totalProductsCount').innerText = products ? products.length : 0;

      if (error || !products || products.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#aaa; padding:40px 20px; font-size:0.85rem; border:1px dashed rgba(255,255,255,0.1); border-radius:12px;">Toko masih kosong. Masukkan produk dan link Social Buzz Anda melalui form di sebelah kiri!</div>`;
        return;
      }

      container.innerHTML = products.map(prod => `
        <div class="product-item">
          <img src="${prod.image}" alt="${prod.title}" onerror="this.src='https://via.placeholder.com/50'">
          <div class="product-info">
            <h4>${prod.title}</h4>
            <div>
              <span>${prod.category}</span>
              <span style="color:#aaa; font-size:0.7rem; margin-left:5px;">${prod.size}</span>
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:700; color:var(--sage-green); font-size:0.85rem; margin-bottom:5px;">
              ${prod.price === 0 ? 'GRATIS' : 'Rp ' + Number(prod.price).toLocaleString('id-ID')}
            </div>
            <button onclick="deleteProduct(${prod.id})" class="btn btn-danger" style="padding: 4px 8px; font-size: 0.7rem;">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    async function saveProduct(e) {
      e.preventDefault();
      const priceVal = parseInt(document.getElementById('productPrice').value) || 0;

      const newProduct = {
        id: Date.now(),
        title: document.getElementById('productTitle').value,
        category: document.getElementById('productCategory').value,
        price: priceVal,
        pricetext: priceVal === 0 ? 'GRATIS' : 'Rp ' + priceVal.toLocaleString('id-ID'),
        size: document.getElementById('productSize').value,
        image: document.getElementById('productImage').value,
        sociabuzzurl: document.getElementById('productSociabuzzUrl').value,
        desc: document.getElementById('productDesc').value
      };

      const { error } = await _supabase.from('products').insert([newProduct]);

      if (error) {
        alert('Gagal mengunggah produk: ' + error.message);
        return;
      }
      
      document.getElementById('productForm').reset();
      loadAdminProducts();
      alert('Berhasil! Produk telah ditambahkan ke Cloud dan langsung tayang publik.');
    }

    async function deleteProduct(id) {
      if (confirm('Hapus produk ini?')) {
        const { error } = await _supabase.from('products').delete().eq('id', id);
        if (error) {
          alert('Gagal menghapus: ' + error.message);
          return;
        }
        loadAdminProducts();
      }
    }
  </script>
</body>
</html>
